<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自定义开局数据编辑器</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --panel: #fffdfa;
      --panel-2: #f7f1e8;
      --panel-3: #eee7dc;
      --input-bg: #fffefa;
      --line: #d9d0c3;
      --line-strong: #a78f72;
      --text: #2f2923;
      --muted: #756a60;
      --accent: #8b5e34;
      --accent-hover: #754d28;
      --accent-2: #2e6f62;
      --danger: #9b2f2f;
      --danger-hover: #842727;
      --warn: #966a00;
      --ok: #276749;
      --focus: #3b6f8f;
      --focus-ring: rgba(59, 111, 143, 0.14);
      --button-hover-bg: #f8efe2;
      --topbar-shadow: 0 2px 10px rgba(52, 40, 28, 0.06);
      --sidebar-bg: #ede6dc;
      --dataset-section-bg: #f8f1e8;
      --dataset-title: #7b4b22;
      --dataset-title-line: #9a6231;
      --dataset-active-bg: #fff6e8;
      --category-section-bg: #eef2ed;
      --category-title: #2e6f62;
      --category-active-bg: #e4f2ec;
      --category-active-text: #235447;
      --sidebar-actions-bg: rgba(255, 253, 250, 0.65);
      --table-head-bg: #e8dfd1;
      --table-head-text: #5a4632;
      --row-bg: rgba(255, 253, 250, 0.58);
      --row-alt-bg: rgba(255, 253, 250, 0.86);
      --row-hover-bg: #fff5e5;
      --row-selected-bg: #ffe8c5;
      --row-selected-outline: rgba(139, 94, 52, 0.25);
      --cell-border: rgba(217, 208, 195, 0.75);
      --batch-bg: #f8f5ef;
      --summary-bg: #eee7dc;
      --editor-head-bg: #fbf7f0;
      --field-label: #4c3c2d;
      --tag-editor-bg: #fffefa;
      --tag-bg: #f8efe2;
      --tag-border: #d4c2aa;
      --tag-text: #513c25;
      --pill-bg: #eadfce;
      --pill-text: #3f3429;
      --details-bg: #fffaf3;
      --details-head-bg: #f4eadb;
      --splitter-bg: #d8cabb;
      --splitter-hover-bg: #bda98f;
      --splitter-line: rgba(120, 96, 72, 0.25);
      --splitter-grip: rgba(100, 78, 55, 0.45);
      --modal-backdrop: rgba(31, 24, 18, 0.35);
      --choice-bg: #fffaf3;
      --rarity-common-bg: #6f5b45;
      --rarity-common-text: #fffaf0;
      --rarity-uncommon-bg: #1f7665;
      --rarity-uncommon-text: #ffffff;
      --rarity-rare-bg: #1f5f9f;
      --rarity-rare-text: #ffffff;
      --rarity-epic-bg: #7d3f8c;
      --rarity-epic-text: #ffffff;
      --rarity-legendary-bg: #9a610e;
      --rarity-legendary-text: #ffffff;
      --rarity-mythic-bg: #5d328c;
      --rarity-mythic-text: #ffffff;
      --rarity-only-bg: #3b2569;
      --rarity-only-text: #ffffff;
      --shadow: 0 10px 25px rgba(52, 40, 28, 0.12);
      font-family:
        "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #171a1d;
      --panel: #22262b;
      --panel-2: #2a2f35;
      --panel-3: #30353b;
      --input-bg: #181c20;
      --line: #3c444c;
      --line-strong: #637080;
      --text: #eee7dd;
      --muted: #b7aa9b;
      --accent: #d09a5f;
      --accent-hover: #e0ad72;
      --accent-2: #65bca5;
      --danger: #c95d5d;
      --danger-hover: #df7373;
      --warn: #e5bd58;
      --ok: #7bd49c;
      --focus: #73afd1;
      --focus-ring: rgba(115, 175, 209, 0.22);
      --button-hover-bg: #30363d;
      --topbar-shadow: 0 2px 14px rgba(0, 0, 0, 0.32);
      --sidebar-bg: #1b2024;
      --dataset-section-bg: #241f1b;
      --dataset-title: #e0ad72;
      --dataset-title-line: #b5753a;
      --dataset-active-bg: #3a2c1f;
      --category-section-bg: #1c2524;
      --category-title: #79ccb6;
      --category-active-bg: #223b36;
      --category-active-text: #bff4e5;
      --sidebar-actions-bg: rgba(34, 38, 43, 0.82);
      --table-head-bg: #2f3439;
      --table-head-text: #eadfce;
      --row-bg: #1d2125;
      --row-alt-bg: #22272c;
      --row-hover-bg: #2f363d;
      --row-selected-bg: #3f321f;
      --row-selected-outline: rgba(224, 173, 114, 0.38);
      --cell-border: rgba(68, 76, 84, 0.86);
      --batch-bg: #252a2f;
      --summary-bg: #20252a;
      --editor-head-bg: #24292f;
      --field-label: #e5d8ca;
      --tag-editor-bg: #181c20;
      --tag-bg: #33291e;
      --tag-border: #7c6046;
      --tag-text: #f2ddc5;
      --pill-bg: #34302a;
      --pill-text: #eee0cc;
      --details-bg: #1d2227;
      --details-head-bg: #2c3035;
      --splitter-bg: #293038;
      --splitter-hover-bg: #3a4651;
      --splitter-line: rgba(130, 145, 160, 0.28);
      --splitter-grip: rgba(190, 203, 214, 0.42);
      --modal-backdrop: rgba(0, 0, 0, 0.58);
      --choice-bg: #1f2429;
      --rarity-common-bg: #8b7864;
      --rarity-common-text: #101316;
      --rarity-uncommon-bg: #35c2a4;
      --rarity-uncommon-text: #071713;
      --rarity-rare-bg: #62a7f2;
      --rarity-rare-text: #081523;
      --rarity-epic-bg: #c084fc;
      --rarity-epic-text: #1b0e24;
      --rarity-legendary-bg: #f3b553;
      --rarity-legendary-text: #241400;
      --rarity-mythic-bg: #d6a3ff;
      --rarity-mythic-text: #1d0f2d;
      --rarity-only-bg: #f4d27a;
      --rarity-only-text: #211500;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      min-height: 34px;
      padding: 7px 11px;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: var(--button-hover-bg);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      --sidebar-w: 220px;
      --editor-w: 34vw;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--topbar-shadow);
      z-index: 3;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 210px;
      margin-right: 6px;
    }

    .brand strong {
      font-size: 16px;
      line-height: 1.2;
    }

    .brand span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
      flex: 1;
    }

    .file-label {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-label input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .danger {
      color: white;
      background: var(--danger);
      border-color: var(--danger);
    }

    .danger:hover:not(:disabled) {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
    }

    .ghost {
      background: transparent;
    }

    .status {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 8px minmax(560px, 1fr) 8px minmax(520px, var(--editor-w));
      min-height: 0;
    }

    .splitter {
      position: relative;
      min-height: 0;
      background: var(--splitter-bg);
      cursor: col-resize;
      z-index: 4;
      border-left: 1px solid var(--splitter-line);
      border-right: 1px solid var(--splitter-line);
    }

    .splitter::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 44px;
      border-radius: 4px;
      background: var(--splitter-grip);
      transform: translate(-50%, -50%);
    }

    .splitter:hover,
    .splitter.dragging {
      background: var(--splitter-hover-bg);
    }

    .sidebar,
    .center,
    .editor {
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
    }

    .side-section {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--dataset-section-bg);
    }

    .side-section .side-title {
      color: var(--dataset-title);
      border-left: 4px solid var(--dataset-title-line);
      padding-left: 8px;
    }

    .side-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--accent);
    }

    .dataset-list,
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dataset-button,
    .category-button {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: var(--panel);
    }

    .category-drag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 11px;
      user-select: none;
      cursor: grab;
    }

    .dataset-button.active {
      border-color: var(--accent);
      background: var(--dataset-active-bg);
      color: var(--accent);
      font-weight: 700;
    }

    .category-button.active {
      border-color: var(--category-title);
      background: var(--category-active-bg);
      color: var(--category-active-text);
      font-weight: 700;
    }

    .category-button.dragging {
      opacity: 0.48;
    }

    .category-button.drop-before {
      box-shadow: inset 0 3px 0 var(--accent);
    }

    .category-button.drop-after {
      box-shadow: inset 0 -3px 0 var(--accent);
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .category-scroll {
      overflow: auto;
      min-height: 0;
      padding: 12px;
      background: var(--category-section-bg);
    }

    .category-scroll .side-title {
      color: var(--category-title);
      border-left: 4px solid var(--category-title);
      padding-left: 8px;
    }

    .sidebar-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--sidebar-actions-bg);
    }

    .center {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: var(--bg);
    }

    .filters,
    .batchbar {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .filters {
      grid-template-columns: minmax(180px, 1fr) 140px 140px 150px;
    }

    .batchbar {
      grid-template-columns: auto 150px 120px 1fr auto auto auto;
      align-items: center;
      background: var(--batch-bg);
    }

    .batchbar.is-empty {
      display: none;
    }

    .batchbar .batch-title {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .table-wrap {
      overflow: auto;
      min-height: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--table-head-bg);
      box-shadow: 0 1px 0 var(--line);
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--cell-border);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--table-head-text);
      font-weight: 700;
      white-space: nowrap;
    }

    tbody tr {
      background: var(--row-bg);
      cursor: pointer;
    }

    tbody tr:nth-child(even) {
      background: var(--row-alt-bg);
    }

    tbody tr:hover {
      background: var(--row-hover-bg);
    }

    tbody tr.selected {
      background: var(--row-selected-bg);
      outline: 2px solid var(--row-selected-outline);
      outline-offset: -2px;
    }

    tbody tr.dragging {
      opacity: 0.48;
    }

    tbody tr.drop-before {
      box-shadow: inset 0 3px 0 var(--accent);
    }

    tbody tr.drop-after {
      box-shadow: inset 0 -3px 0 var(--accent);
    }

    .row-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 12px;
      user-select: none;
      cursor: grab;
    }

    .drag-handle.is-disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .cell-name {
      font-weight: 700;
      max-width: 280px;
      word-break: break-word;
    }

    .cell-muted {
      color: var(--muted);
      font-size: 12px;
    }

    .pill-line {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--pill-bg);
      color: var(--pill-text);
      font-size: 12px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rarity-common {
      background: var(--rarity-common-bg);
      color: var(--rarity-common-text);
    }

    .rarity-only {
      background: var(--rarity-only-bg);
      color: var(--rarity-only-text);
    }

    .rarity-mythic {
      background: var(--rarity-mythic-bg);
      color: var(--rarity-mythic-text);
    }

    .rarity-legendary {
      background: var(--rarity-legendary-bg);
      color: var(--rarity-legendary-text);
    }

    .rarity-epic {
      background: var(--rarity-epic-bg);
      color: var(--rarity-epic-text);
    }

    .rarity-rare {
      background: var(--rarity-rare-bg);
      color: var(--rarity-rare-text);
    }

    .rarity-uncommon {
      background: var(--rarity-uncommon-bg);
      color: var(--rarity-uncommon-text);
    }

    .warning-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--warn);
      font-size: 12px;
      max-width: 230px;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      background: var(--summary-bg);
      color: var(--muted);
      font-size: 12px;
    }

    .summary-log {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editor {
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
    }

    .editor-head {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--editor-head-bg);
    }

    .editor-head h2 {
      margin: 0;
      font-size: 18px;
      color: var(--accent);
    }

    .editor-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .editor-scroll {
      overflow: auto;
      min-height: 0;
      padding: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      color: var(--field-label);
      font-size: 13px;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tag-editor {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--tag-editor-bg);
    }

    .tag-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 2px 6px;
      border: 1px solid var(--tag-border);
      border-radius: 5px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 12px;
      user-select: none;
      cursor: grab;
    }

    .tag-grip {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: -2px;
      opacity: 0.75;
    }

    .tag-item.dragging {
      opacity: 0.45;
    }

    .tag-item.drop-before {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .tag-item.drop-after {
      box-shadow: inset -3px 0 0 var(--accent);
    }

    .tag-item button {
      min-height: 0;
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--danger);
      line-height: 1;
    }

    .tag-editor input {
      flex: 1 1 140px;
      min-width: 110px;
      border: none;
      min-height: 24px;
      padding: 2px;
      box-shadow: none;
    }

    .kv-list,
    .nested-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .kv-row {
      display: grid;
      grid-template-columns: minmax(130px, 0.32fr) 1fr auto;
      gap: 8px;
      align-items: start;
    }

    .kv-row textarea {
      min-height: 84px;
    }

    .small-btn {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 12px;
    }

    details {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--details-bg);
      margin-bottom: 10px;
      overflow: hidden;
    }

    details > summary {
      cursor: pointer;
      padding: 9px 10px;
      color: var(--accent);
      font-weight: 700;
      background: var(--details-head-bg);
    }

    .detail-body {
      padding: 10px;
    }

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--editor-head-bg);
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      min-width: 250px;
      max-width: 460px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);

      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;

      background: var(--modal-backdrop);

      max-height: min(720px, calc(100vh - 32px));

      grid-template-rows: auto 1fr auto;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);

      margin: 0;
      padding: 14px 16px;
      color: var(--accent);
      border-bottom: 1px solid var(--line);

      padding: 14px 16px;
      line-height: 1.6;
      white-space: pre-wrap;

      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: var(--editor-head-bg);
    }

    .category-picker {
      display: grid;
      gap: 14px;
      white-space: normal;
    }

    .category-picker label {
      display: grid;
      gap: 6px;
      color: var(--field-label);
      font-weight: 700;
    }

    .category-picker .hint {
      line-height: 1.5;
      font-weight: 400;
    }

    .choice-list {
      display: grid;
      gap: 10px;
      white-space: normal;
    }

    .choice-card {
      display: grid;
      gap: 4px;
      min-height: 52px;
      text-align: left;
      background: var(--choice-bg);
    }

    .choice-card strong {
      font-size: 14px;
      color: var(--accent);
    }

    .choice-card span {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1200px) {
      .layout {
        --sidebar-w: 200px;
        --editor-w: 520px;
        grid-template-columns: var(--sidebar-w) 8px minmax(480px, 1fr) 8px minmax(460px, var(--editor-w));
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .batchbar {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        width: 100%;
      }

      .layout {
        display: block;
      }

      .splitter {
        display: none;

      .sidebar,
      .center,
      .editor {
        height: auto;
        min-height: 0;
        overflow: visible;
        border: none;
      }

      .table-wrap,
      .editor-scroll {
        max-height: none;
        overflow: visible;
      }

      .filters,
      .batchbar {
        grid-template-columns: 1fr;
      }
    }

  <script>
    "use strict";

    const JSON5Lite = {
      parse(text) {
        const source = String(text || "").replace(/^\uFEFF/, "");
        try {
          return JSON.parse(source);
        } catch (_jsonError) {
          try {
            return Function('"use strict"; return (' + source + "\n);")();
          } catch (error) {
            error.message = "JSON/JSON5 解析失败: " + error.message;
            throw error;
          }
        }
      },
    };

    // ===== 注释保留：解析原文件并把注释按 JSON 路径锚定，导出时再放回 =====

    // 将 JSON5 源码切成 JSON 结构 token 与注释 token；解析失败返回 null（此时不做注释保留）。
    function tokenizeJson5(source) {
      const tokens = [];
      let i = 0;
      const n = source.length;
      const isWs = c => c === " " || c === "\t" || c === "\r" || c === "\n";
      const isPunct = c => c === "{" || c === "}" || c === "[" || c === "]" || c === "," || c === ":";
      while (i < n) {
        const ch = source[i];
        if (isWs(ch)) { i += 1; continue; }
        if (ch === "/" && source[i + 1] === "/") {
          const end = source.indexOf("\n", i);
          tokens.push({ type: "COMMENT", text: source.slice(i, end === -1 ? n : end) });
          i = end === -1 ? n : end;
          continue;
        }
        if (ch === "/" && source[i + 1] === "*") {
          const end = source.indexOf("*/", i + 2);
          tokens.push({ type: "COMMENT", text: source.slice(i, end === -1 ? n : end + 2) });
          i = end === -1 ? n : end + 2;
          continue;
        }
        if (ch === '"' || ch === "'") {
          const quote = ch;
          let j = i + 1;
          let text = "";
          let closed = false;
          while (j < n) {
            const c = source[j];
            if (c === quote) { closed = true; break; }
            if (c === "\\") {
              const e = source[j + 1];
              if (e === undefined) { j += 1; break; }
              if (e === "u") {
                text += String.fromCharCode(parseInt(source.slice(j + 2, j + 6), 16) || 0);
                j += 6;
              } else {
                const esc = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", '"': '"', "'": "'", "\\": "\\", "/": "/" };
                text += esc[e] !== undefined ? esc[e] : e;
                j += 2;
              }
              continue;
            }
            text += c;
            j += 1;
          }
          if (!closed) return null; // 未闭合字符串：放弃注释保留
          tokens.push({ type: "STRING", text: source.slice(i, j + 1), value: text });
          i = j + 1;
          continue;
        }
        if (isPunct(ch)) { tokens.push({ type: "PUNCT", text: ch }); i += 1; continue; }
        let j = i;
        while (j < n) {
          const c2 = source[j];
          if (isWs(c2) || isPunct(c2)) break;
          if (c2 === "/" && (source[j + 1] === "/" || source[j + 1] === "*")) break;
          j += 1;
        }
        if (j === i) return null;
        tokens.push({ type: "ATOM", text: source.slice(i, j) });
        i = j;
      }
      return tokens;
    }

    // 返回 { pre, post, rootPre }；pre[path] = 该键/数组项前的注释，post[path] = 该容器收尾前（“}”/“]”前）的注释。
    function buildCommentAnchors(source) {
      const tokens = tokenizeJson5(source);
      if (!tokens || tokens.length === 0) return null;
      // 用普通对象而不是 Map，方便被 snapshot/undo 的 deepClone（JSON 序列化）完整保留。
      const pre = Object.create(null);
      const post = Object.create(null);
      const rootPre = [];
      let pos = 0;
      const cur = () => (pos < tokens.length ? tokens[pos] : null);
      const collect = () => {
        const list = [];
        while (cur() && cur().type === "COMMENT") { list.push(cur().text); pos += 1; }
        return list;
      };
      const pk = path => path.join("\u0000");

      function parseValue(path) {
        collect(); // 值前的注释：标量丢弃，容器交给 parseObject/parseArray 处理
        const token = cur();
        if (!token) return;
        if (token.text === "{") parseObject(path);
        else if (token.text === "[") parseArray(path);
        else pos += 1;
      }

      function parseObject(path) {
        if (!cur() || cur().text !== "{") throw new Error("bad object");
        pos += 1;
        for (;;) {
          const comments = collect();
          const token = cur();
          if (!token) return;
          if (token.text === ",") { pos += 1; continue; }
          if (token.text === "}") { pos += 1; if (comments.length) post[pk(path)] = comments; return; }
          if (token.type !== "STRING" && token.type !== "ATOM") { pos += 1; continue; }
          const key = token.type === "STRING" ? token.value : token.text;
          const keyPath = path.concat(String(key));
          if (comments.length) pre[pk(keyPath)] = comments;
          pos += 1; // key
          collect(); // key 与冒号之间的注释忽略
          if (!cur() || cur().text !== ":") throw new Error("bad colon");
          pos += 1; // ':'
          parseValue(keyPath);
        }
      }

      function parseArray(path) {
        if (!cur() || cur().text !== "[") throw new Error("bad array");
        pos += 1;
        let index = 0;
        for (;;) {
          const comments = collect();
          const token = cur();
          if (!token) return;
          if (token.text === ",") { pos += 1; continue; }
          if (token.text === "]") { pos += 1; if (comments.length) post[pk(path)] = comments; return; }
          const itemPath = path.concat(String(index));
          if (comments.length) pre[pk(itemPath)] = comments;
          parseValue(itemPath);
          index += 1;
        }
      }

      try {
        const head = collect();
        if (head.length) rootPre.push(...head);
        const first = cur();
        if (!first) return null;
        if (first.text === "{") parseObject([]);
        else if (first.text === "[") parseArray([]);
        else return null;
        const tail = collect();
        if (tail.length) post[pk([])] = (post[pk([])] || []).concat(tail);
      } catch (_error) {
        return null; // 结构异常则放弃注释保留，退回普通 JSON 序列化
      }
      return { pre, post, rootPre };
    }

    // 按“路径 → 注释”把当前数据重新排版成 JSON/JSON5，尽量放回原来的注释。
    function serializeWithComments(data, anchors) {
      const pre = anchors.pre;
      const post = anchors.post;
      const pk = path => path.join("\u0000");
      const renderScalar = value => {
        if (value === null || value === undefined) return "null";
        if (typeof value === "string") return JSON.stringify(value);
        return String(value);
      };

      function renderValue(node, path) {
        if (Array.isArray(node)) return renderArray(node, path);
        if (node !== null && typeof node === "object") return renderObject(node, path);
        return [{ text: renderScalar(node), level: 0 }];
      }

      // 追加逗号到“当前条目的最后一个物理行”（标量行，或容器的收尾行）。
      function addComma(items) {
        const last = items[items.length - 1];
        items[items.length - 1] = { text: last.text + ",", level: last.level };
      }

      function renderObject(obj, path) {
        const out = [{ text: "{", level: 0 }];
        const closeComments = post[pk(path)];
        const entries = Object.entries(obj);
        entries.forEach(([key, value], index) => {
          const childPath = path.concat(key);
          const before = pre[pk(childPath)];
          if (before) before.forEach(comment => out.push({ text: comment, level: 1 }));
          const sub = renderValue(value, childPath);
          out.push({ text: JSON.stringify(key) + ": " + sub[0].text, level: 1 });
          sub.slice(1).forEach(item => out.push({ text: item.text, level: item.level + 1 }));
          if (index < entries.length - 1) addComma(out);
        });
        if (closeComments) closeComments.forEach(comment => out.push({ text: comment, level: 1 }));
        out.push({ text: "}", level: 0 });
        return out;
      }

      function renderArray(arr, path) {
        const out = [{ text: "[", level: 0 }];
        const closeComments = post[pk(path)];
        arr.forEach((value, index) => {
          const childPath = path.concat(String(index));
          const before = pre[pk(childPath)];
          if (before) before.forEach(comment => out.push({ text: comment, level: 1 }));
          const sub = renderValue(value, childPath);
          out.push({ text: sub[0].text, level: 1 });
          sub.slice(1).forEach(item => out.push({ text: item.text, level: item.level + 1 }));
          if (index < arr.length - 1) addComma(out);
        });
        if (closeComments) closeComments.forEach(comment => out.push({ text: comment, level: 1 }));
        out.push({ text: "]", level: 0 });
        return out;
      }

      const rootItems = renderValue(data, []);
      const output = [];
      (anchors.rootPre || []).forEach(comment => output.push(comment));
      rootItems.forEach(item => output.push({ text: item.text, level: item.level }));
      return output.map(item => "  ".repeat(item.level) + item.text).join("\n");
    }

    const RARITIES = ["only", "mythic", "legendary", "epic", "rare", "uncommon", "common"];
    const RARITY_LABELS = {
      common: "普通",
      uncommon: "优良",
      rare: "稀有",
      epic: "史诗",
      legendary: "传说",
      mythic: "神话",
      only: "唯一",
    };
    const FIELD_LABELS = {
      name: "名称",
      cost: "消耗",
      type: "类型",
      rarity: "品质",
      quantity: "数量",
      tag: "标签",
      effect: "效果",
      description: "描述",
      consume: "消耗说明",
      lifeLevel: "生命层级",
      level: "等级",
      race: "种族",
      identity: "身份",
      career: "职业",
      attributes: "属性",
      requiredRace: "需要种族",
      requiredLocation: "需要地点",
      requiredIdentity: "需要身份",
    };
    const ATTRIBUTE_LABELS = {
      strength: "力量",
      dexterity: "敏捷",
      constitution: "体质",
      intelligence: "智力",
      mind: "精神",
    };
    const RARITY_ORDER = new Map(RARITIES.map((value, index) => [value, index]));
    // 表格采用滚动增量渲染：首屏只画 RENDER_CHUNK 行，滚动接近底部时再追加一批。
    // 这样几千条数据也不会一次性创建上万个 DOM 节点，同时保留行拖拽与浏览器查找能力。
    const RENDER_CHUNK = 300;
    const HTML_ESCAPE_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    // assets.json 使用中文键名，这里做一层别名映射，让通用逻辑复用英文键。
    const ASSET_FIELD_ALIAS = {
      type: "类型",
      tag: "标签",
      effect: "效果",
      description: "描述",
    };
    const ASSET_CHILDREN_KEY = "内部资产";
    const DATASETS = {
      "equipments.json": {
        label: "装备",
        kind: "collection",
        required: ["name", "cost", "type", "rarity", "tag", "effect", "description"],
      },
      "items.json": {
        label: "道具",
        kind: "collection",
        required: ["name", "cost", "type", "rarity", "quantity", "tag", "effect", "description"],
      },
      "skills.json": {
        label: "技能",
        kind: "collection",
        required: ["name", "cost", "type", "rarity", "consume", "tag", "effect", "description"],
      },
      "assets.json": {
        label: "资产",
        kind: "collection",
        required: ["name", "cost", "rarity", "type", "tag", "description"],
      },
      "partners.json": {
        label: "伙伴",
        kind: "collection",
        required: ["name", "cost", "lifeLevel", "level", "race", "identity", "career", "attributes"],
      },
      "backgrounds.json": {
        label: "初始剧情",
        kind: "collection",
        required: ["name", "description"],
      },
      "baseInfo.json": {
        label: "基础信息",
        kind: "baseInfo",
        required: [],
      },
      "coreClassification.json": {
        label: "核心分类",
        kind: "coreClassification",
        required: [],
      },
    };

    function isAssetFile(filename = state.currentFile) {
      return filename === "assets.json";
    }

    function fieldKey(key, filename = state.currentFile) {
      if (isAssetFile(filename) && ASSET_FIELD_ALIAS[key]) return ASSET_FIELD_ALIAS[key];
      return key;
    }

    function readField(item, key, filename = state.currentFile) {
      if (!item) return undefined;
      return item[fieldKey(key, filename)];
    }

    function hasField(item, key, filename = state.currentFile) {
      return Boolean(item) && fieldKey(key, filename) in item;
    }

    const state = {
      files: {},
      // 任何一次数据改动都会自增，用于失效行缓存。
      dataVersion: 0,
      currentFile: "equipments.json",
      currentCategory: "__all__",
      selected: null,
      selectedRows: new Set(),
      draggingRowId: null,
      dragOverRowId: null,
      dropPosition: "before",
      renderLimit: 300,
      draggingCategory: null,
      dragOverCategory: null,
      categoryDropPosition: "before",
      // 拖拽过程中直接持有节点，避免每次 dragover 都全文档查询。
      dragNode: null,
      dropMarkerNode: null,
      search: "",
      rarity: "",
      type: "",
      sort: "category",
      undo: [],
      redo: [],
      changes: [],
      dirty: new Set(),
      modalResolver: null,
      // 记录每个折叠块（details）的展开状态，key 由 renderEditor 生成的路径决定。
      // 编辑器每次改动都会整块重建，靠它把用户手动展开/收起的状态保留下来。
      detailsOpen: new Map(),
    };

    const el = {};
    const $ = id => document.getElementById(id);
    let searchTimer = null;

    window.addEventListener("DOMContentLoaded", init);
    window.addEventListener("beforeunload", event => {
      if (state.dirty.size > 0) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    function init() {
      [
        "fileInput",
        "exportBtn",
        "historyBtn",
        "summaryBtn",
        "themeToggleBtn",
        "statusText",
        "loadedCount",
        "datasetList",
        "leftSplitter",
        "rightSplitter",
        "categoryCount",
        "categoryList",
        "addCategoryBtn",
        "mergeCategoryBtn",
        "renameCategoryBtn",
        "deleteCategoryBtn",
        "addEntityBtn",
        "searchInput",
        "rarityFilter",
        "typeFilter",
        "sortSelect",
        "batchbar",
        "batchTitle",
        "batchCategory",
        "batchRarity",
        "batchTag",
        "batchCost",
        "applyBatchBtn",
        "deleteSelectedBtn",
        "selectAllRows",
        "tableWrap",
        "entityTable",
        "emptyState",
        "tableSummary",
        "dirtyState",
        "editorTitle",
        "editorSubtitle",
        "editorScroll",
        "duplicateEntityBtn",
        "moveEntityBtn",
        "deleteEntityBtn",
        "toast",
        "modalBackdrop",
        "modalTitle",
        "modalContent",
        "modalActions",
        "modalClose",
      ].forEach(id => (el[id] = $(id)));

      setupIncrementalTable();

      el.fileInput.addEventListener("change", handleFiles);
      el.exportBtn.addEventListener("click", showExportChoices);
      el.historyBtn.addEventListener("click", showHistoryChoices);
      el.summaryBtn.addEventListener("click", showChangeSummary);
      el.themeToggleBtn.addEventListener("click", toggleTheme);
      el.addCategoryBtn.addEventListener("click", addCategory);
      el.mergeCategoryBtn.addEventListener("click", mergeCategory);
      el.renameCategoryBtn.addEventListener("click", renameCategory);
      el.deleteCategoryBtn.addEventListener("click", deleteCategory);
      el.addEntityBtn.addEventListener("click", addEntity);
      el.searchInput.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => flushSearch(), 150);
      });
      el.searchInput.addEventListener("change", flushSearch);
      el.rarityFilter.addEventListener("change", () => {
        state.rarity = el.rarityFilter.value;
        resetRenderLimit();
        renderTable();
      });
      el.typeFilter.addEventListener("change", () => {
        state.type = el.typeFilter.value;
        resetRenderLimit();
        renderTable();
      });
      el.sortSelect.addEventListener("change", () => {
        state.sort = el.sortSelect.value;
        resetRenderLimit();
        renderTable();
      });
      el.selectAllRows.addEventListener("change", toggleAllVisibleRows);
      el.applyBatchBtn.addEventListener("click", applyBatch);
      el.deleteSelectedBtn.addEventListener("click", deleteSelected);
      el.duplicateEntityBtn.addEventListener("click", duplicateSelected);
      el.moveEntityBtn.addEventListener("click", moveSelected);
      el.deleteEntityBtn.addEventListener("click", deleteSelectedEntity);
      el.modalClose.addEventListener("click", closeModal);
      el.modalBackdrop.addEventListener("click", event => {
        if (event.target === el.modalBackdrop) closeModal();
      });
      setupSplitters();
      applyTheme(loadThemePreference());

      render();
    }

    function loadThemePreference() {
      try {
        const saved = localStorage.getItem("databank-editor-theme");
        if (saved === "light" || saved === "dark") return saved;
      } catch (_error) {
        // 本地文件模式下少数浏览器可能禁用 localStorage，退回系统主题即可。
      }
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme(theme) {
      const normalized = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalized;
      if (el.themeToggleBtn) {
        el.themeToggleBtn.textContent = normalized === "dark" ? "浅色" : "深色";
        el.themeToggleBtn.title = normalized === "dark" ? "切换到浅色主题" : "切换到深色主题";
      }
      try {
        localStorage.setItem("databank-editor-theme", normalized);
      } catch (_error) {
        // 不影响编辑器使用。
      }
    }

    function toggleTheme() {
      const current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      applyTheme(current === "dark" ? "light" : "dark");
    }

    async function handleFiles(event) {
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;
      const loaded = [];
      const skipped = [];
      for (const file of files) {
        const name = normalizeFilename(file.name);
        if (!DATASETS[name]) {
          skipped.push(file.name);
          continue;
        }
        try {
          const text = await file.text();
          const data = JSON5Lite.parse(text);
          ensureShape(name, data);
          state.files[name] = {
            filename: name,
            label: DATASETS[name].label,
            kind: DATASETS[name].kind,
            data,
            raw: text,
            anchors: buildCommentAnchors(text),
            everEdited: false,
            importedAt: new Date().toISOString(),
          };
          loaded.push(name);
        } catch (error) {
          showToast(file.name + " 导入失败: " + error.message);
        }
      }
      if (loaded.length > 0) {
        state.dataVersion += 1;
        if (!state.files[state.currentFile]) state.currentFile = loaded[0];
        state.currentCategory = "__all__";
        state.selected = null;
        state.selectedRows.clear();
        state.changes.push("导入 " + loaded.join(", "));
        setStatus("已导入 " + loaded.length + " 个文件" + (skipped.length ? "，跳过 " + skipped.length + " 个未知文件" : ""));
      } else if (skipped.length) {
        showToast("没有识别到目标数据文件。");
      }
      event.target.value = "";
      render();
    }

    function normalizeFilename(name) {
      const leaf = String(name).split(/[\\/]/).pop();
      if (DATASETS[leaf]) return leaf;
      const lower = leaf.toLowerCase();
      return Object.keys(DATASETS).find(file => file.toLowerCase() === lower) || leaf;
    }

    function ensureShape(filename, data) {
      if (!data || typeof data !== "object" || Array.isArray(data)) {
        throw new Error("顶层必须是对象");
      }
      const config = DATASETS[filename];
      if (config.kind === "collection") {
        for (const [category, value] of Object.entries(data)) {
          if (!Array.isArray(value)) throw new Error("分类 " + category + " 必须是数组");
        }
      }
    }

    // 滚动接近底部时追加渲染下一批行；用 rAF 合并同一帧内的多次 scroll 事件。
    function setupIncrementalTable() {
      if (!el.tableWrap) return;
      let queued = false;
      el.tableWrap.addEventListener(
        "scroll",
        () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            const wrap = el.tableWrap;
            if (!wrap) return;
            if (wrap.scrollTop + wrap.clientHeight < wrap.scrollHeight - 400) return;
            const visible = getVisibleRows().length;
            if (state.renderLimit >= visible) return;
            state.renderLimit = Math.min(visible, state.renderLimit + RENDER_CHUNK);
            renderTable();
          });
        },
        { passive: true },
      );
    }

    // 切换文件/分类/筛选/排序/搜索时回到首批，避免沿用上一次已展开的渲染量。
    function resetRenderLimit() {
      state.renderLimit = RENDER_CHUNK;
    }

    function flushSearch() {
      clearTimeout(searchTimer);
      searchTimer = null;
      const next = el.searchInput ? el.searchInput.value.trim().toLowerCase() : "";
      if (next === state.search) return;
      state.search = next;
      resetRenderLimit();
      renderTable();
    }

    function render() {
      renderDatasets();
      renderCategories();
      renderFilters();
      renderTable();
      renderEditor();
      updateButtons();
    }

    function renderDatasets() {
      el.datasetList.innerHTML = "";
      const loaded = Object.keys(DATASETS).filter(name => state.files[name]).length;
      el.loadedCount.textContent = loaded + "/" + Object.keys(DATASETS).length;
      for (const [filename, config] of Object.entries(DATASETS)) {
        const button = document.createElement("button");
        button.className = "dataset-button" + (state.currentFile === filename ? " active" : "");
        button.innerHTML = "<span>" + escapeHtml(config.label) + "</span><span class=\"count\">" + getFileCount(filename) + "</span>";
        button.addEventListener("click", () => {
          state.currentFile = filename;
          state.currentCategory = "__all__";
          state.selected = null;
          state.selectedRows.clear();
          resetRenderLimit();
          render();
        });
        el.datasetList.appendChild(button);
      }
    }

    function renderCategories() {
      el.categoryList.innerHTML = "";
      const categories = getCategories();
      el.categoryCount.textContent = String(categories.length);
      const allButton = document.createElement("button");
      allButton.className = "category-button" + (state.currentCategory === "__all__" ? " active" : "");
      allButton.innerHTML = "<span>全部</span><span class=\"count\">" + getRows().length + "</span>";
      allButton.addEventListener("click", () => {
        state.currentCategory = "__all__";
        state.selected = null;
        state.selectedRows.clear();
        resetRenderLimit();
        render();
      });
      el.categoryList.appendChild(allButton);

      const categoryDragEnabled = getCategories().length > 1;
      el.categoryList.title = categoryDragEnabled ? "按住分类按钮拖动，会直接改变这个分类在 JSON 里的位置" : "";

      for (const category of categories) {
        const button = document.createElement("button");
        button.className = "category-button" + (state.currentCategory === category ? " active" : "");
        button.innerHTML =
          "<span>" + escapeHtml(category) + "</span><span class=\"count\">" + countInCategory(category) + "</span>" +
          (categoryDragEnabled ? "<span class=\"category-drag\" title=\"按住左键拖动，会直接改变这个分类在 JSON 里的位置\">拖</span>" : "");
        button.draggable = categoryDragEnabled;
        button.addEventListener("click", event => {
          if (event.target && event.target.closest(".category-drag")) return;
          state.currentCategory = category;
          state.selected = null;
          state.selectedRows.clear();
          resetRenderLimit();
          render();
        });
        if (categoryDragEnabled) {
          button.addEventListener("dragstart", event => startCategoryDrag(event, category));
          button.addEventListener("dragover", event => updateCategoryDrop(event, category));
          button.addEventListener("dragleave", event => clearCategoryDrop(event));
          button.addEventListener("drop", event => dropCategory(event, category));
          button.addEventListener("dragend", clearDragState);
        }
        el.categoryList.appendChild(button);
      }
    }

    function renderFilters() {
      const rows = getRows();
      const rarityOptions = sortRarities(unique(rows.map(row => getItem(row)?.rarity).filter(Boolean)));
      const typeOptions = unique(rows.map(row => readField(getItem(row), "type")).filter(Boolean));
      setSelect(el.rarityFilter, [["", "全部品质"]].concat(rarityOptions.map(value => [value, rarityLabel(value)])), state.rarity);
      setSelect(el.typeFilter, [["", "全部类型"]].concat(typeOptions.map(value => [value, value])), state.type);
      setSelect(
        el.batchCategory,
        [["", "移动到分类"]].concat(getCategories().map(category => [category, category]), [["__new__", "新建分类..."]]),
        "",
      );
    }

    function renderTable() {
      const visibleRows = getVisibleRows();
      const limit = Math.max(RENDER_CHUNK, Math.min(state.renderLimit, visibleRows.length));
      const rows = visibleRows.length > limit ? visibleRows.slice(0, limit) : visibleRows;
      const dragEnabled = canDragRows();
      const scrollTop = el.tableWrap ? el.tableWrap.scrollTop : 0;
      el.entityTable.innerHTML = "";
      el.emptyState.style.display = visibleRows.length ? "none" : "flex";
      el.selectAllRows.checked = visibleRows.length > 0 && visibleRows.every(row => state.selectedRows.has(row.id));

      const fragment = document.createDocumentFragment();
      const duplicateMap = getDuplicateNameMap();
      for (const row of rows) {
        const item = getItem(row);
        const warnings = validateRow(row, duplicateMap);
        const tr = document.createElement("tr");
        tr.dataset.rowId = row.id;
        tr.draggable = dragEnabled;
        if (state.selected && state.selected.id === row.id) tr.classList.add("selected");
        if (state.draggingRowId === row.id) tr.classList.add("dragging");
        if (state.dragOverRowId === row.id) tr.classList.add(state.dropPosition === "after" ? "drop-after" : "drop-before");
        tr.addEventListener("click", event => {
          if (event.target && event.target.matches("input[type='checkbox']")) return;
          if (event.target && event.target.closest(".drag-handle")) return;
          state.selected = row;
          renderTable();
          renderEditor();
          updateButtons();
        });
        if (dragEnabled) {
          tr.addEventListener("dragstart", event => startRowDrag(event, row));
          tr.addEventListener("dragover", event => updateRowDrop(event, row));
          tr.addEventListener("dragleave", event => clearRowDrop(event, row));
          tr.addEventListener("drop", event => dropRow(event, row));
          tr.addEventListener("dragend", clearDragState);
        }

        const checkboxTd = document.createElement("td");
        const controls = document.createElement("span");
        controls.className = "row-controls";
        if (dragEnabled) {
          const handle = document.createElement("span");
          handle.className = "drag-handle";
          handle.textContent = "拖";
          handle.title = "按住左键拖动，会直接改变这个物品在 JSON 数组里的位置";
          controls.appendChild(handle);
        }
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = state.selectedRows.has(row.id);
        checkbox.addEventListener("change", event => {
          event.stopPropagation();
          if (checkbox.checked) state.selectedRows.add(row.id);
          else state.selectedRows.delete(row.id);
          renderTable();
          updateButtons();
        });
        controls.appendChild(checkbox);
        checkboxTd.appendChild(controls);
        tr.appendChild(checkboxTd);

        tr.appendChild(cell(renderNameCell(row, item)));
        tr.appendChild(cell(escapeHtml(row.category)));
        tr.appendChild(cell(renderTypeOnly(item)));
        tr.appendChild(cell(formatCost(item)));
        tr.appendChild(cell(renderTags(item)));
        tr.appendChild(cell(renderWarnings(warnings)));
        fragment.appendChild(tr);
      }
      el.entityTable.appendChild(fragment);
      if (el.tableWrap) el.tableWrap.scrollTop = scrollTop;

      el.batchTitle.textContent = "已选 " + state.selectedRows.size + " 项";
      el.batchbar.classList.toggle("is-empty", state.selectedRows.size === 0);
      el.tableSummary.textContent = buildTableSummary(rows.length, visibleRows.length);
      el.dirtyState.textContent = state.dirty.size ? "有未导出修改: " + Array.from(state.dirty).join(", ") : "未修改";
    }

    function canDragRows() {
      const current = getCurrent();
      return Boolean(
        current &&
          current.kind === "collection" &&
          state.currentCategory !== "__all__" &&
          state.sort === "category" &&
          !state.search &&
          !state.rarity &&
          !state.type,
      );
    }

    function startRowDrag(event, row) {
      if (!canDragRows()) {
        event.preventDefault();
        return;
      }
      state.draggingRowId = row.id;
      state.dragNode = event.currentTarget;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", row.id);
      event.currentTarget.classList.add("dragging");
    }

    function updateRowDrop(event, row) {
      if (!state.draggingRowId || state.draggingRowId === row.id) return;
      event.preventDefault();
      const position = getDropPosition(event, event.currentTarget);
      clearDropMarkers();
      state.dragOverRowId = row.id;
      state.dropPosition = position;
      state.dropMarkerNode = event.currentTarget;
      state.dropMarkerNode.classList.add(position === "after" ? "drop-after" : "drop-before");
      event.dataTransfer.dropEffect = "move";
    }

    function clearRowDrop(event) {
      if (event.currentTarget.contains(event.relatedTarget)) return;
      event.currentTarget.classList.remove("drop-before", "drop-after");
    }

    function dropRow(event, targetRow) {
      event.preventDefault();
      const sourceId = event.dataTransfer.getData("text/plain") || state.draggingRowId;
      const position = state.dropPosition;
      clearDragState();
      const source = resolveRowById(sourceId);
      const target = resolveRow(targetRow);
      if (!source || !target || source.id === target.id) return;
      reorderCollectionRow(source, target, position);
    }

    function getDropPosition(event, rowNode) {
      const rect = rowNode.getBoundingClientRect();
      return event.clientY > rect.top + rect.height / 2 ? "after" : "before";
    }

    function clearDropMarkers() {
      if (state.dropMarkerNode) {
        state.dropMarkerNode.classList.remove("drop-before", "drop-after");
        state.dropMarkerNode = null;
      }
    }

    function clearDragState() {
      clearDropMarkers();
      if (state.dragNode) {
        state.dragNode.classList.remove("dragging");
        state.dragNode = null;
      }
      state.draggingRowId = null;
      state.dragOverRowId = null;
      state.dropPosition = "before";
      state.draggingCategory = null;
      state.dragOverCategory = null;
      state.categoryDropPosition = "before";
    }

    function startCategoryDrag(event, category) {
      state.draggingCategory = category;
      state.dragNode = event.currentTarget;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", category);
      event.currentTarget.classList.add("dragging");
    }

    function updateCategoryDrop(event, category) {
      if (!state.draggingCategory || state.draggingCategory === category) return;
      event.preventDefault();
      const position = getDropPosition(event, event.currentTarget);
      clearDropMarkers();
      state.dragOverCategory = category;
      state.categoryDropPosition = position;
      state.dropMarkerNode = event.currentTarget;
      state.dropMarkerNode.classList.add(position === "after" ? "drop-after" : "drop-before");
      event.dataTransfer.dropEffect = "move";
    }

    function clearCategoryDrop(event) {
      if (event && event.currentTarget.contains(event.relatedTarget)) return;
      event.currentTarget.classList.remove("drop-before", "drop-after");
    }

    function dropCategory(event, target) {
      event.preventDefault();
      const source = event.dataTransfer.getData("text/plain") || state.draggingCategory;
      const position = state.categoryDropPosition;
      clearDragState();
      if (!source || source === target) return;
      reorderCategory(source, target, position);
    }

    function reorderCategory(source, target, position) {
      const current = getCurrent();
      if (!current || !current.data) return;
      const keys = Object.keys(current.data);
      const sourceIndex = keys.indexOf(source);
      const targetIndex = keys.indexOf(target);
      if (sourceIndex === -1 || targetIndex === -1) return;
      commit("调整分类顺序 " + source + " -> " + target, () => {
        keys.splice(sourceIndex, 1);
        let insertAt = keys.indexOf(target);
        if (position === "after") insertAt += 1;
        keys.splice(insertAt, 0, source);
        const next = {};
        keys.forEach(key => {
          next[key] = current.data[key];
        });
        current.data = next;
      });
      render();
    }

    function reorderCollectionRow(source, target, position) {
      const current = getCurrent();
      if (!current || current.kind !== "collection") return;
      if (source.category !== target.category) {
        showToast("拖动排序只调整同一个分类里的真实顺序；跨分类请用移动分类。");
        renderTable();
        return;
      }
      const list = current.data[source.category];
      const insertIndex = getReorderInsertIndex(source, target, position, list.length - 1);
      if (insertIndex === source.index) {
        renderTable();
        return;
      }
      commit("调整顺序 " + getName(source), () => {
        const [item] = list.splice(source.index, 1);
        list.splice(insertIndex, 0, item);
        state.selected = { id: "row|" + source.category + "|" + insertIndex, category: source.category, index: insertIndex };
      });
      render();
    }

    function getReorderInsertIndex(source, target, position, maxIndexAfterRemove) {
      let insertIndex = target.index;
      if (source.index < target.index) insertIndex -= 1;
      if (position === "after") insertIndex += 1;
      return Math.max(0, Math.min(insertIndex, maxIndexAfterRemove));
    }

    // 编辑器每次改动都会整块重建。这里用一条“当前路径”给折叠块和字段生成稳定 key，
    // 重建后据此还原展开状态、滚动位置和焦点，避免编辑时面板被收起、跳动或失焦。
    let pathStack = ["root"];
    const currentPath = () => pathStack.join("/");

    function withPath(segment, fn) {
      pathStack.push(String(segment));
      try {
        return fn();
      } finally {
        pathStack.pop();
      }
    }

    // parent 传 null 时只创建不挂载（用于需要返回节点的场景）。
    function makeDetails(parent, segment, summaryHtml, defaultOpen, bodyClassName, fill) {
      const key = currentPath() + "/" + segment;
      const details = document.createElement("details");
      details.dataset.dkey = key;
      details.open = state.detailsOpen.has(key) ? Boolean(state.detailsOpen.get(key)) : Boolean(defaultOpen);
      details.innerHTML = "<summary>" + summaryHtml + "</summary>";
      details.addEventListener("toggle", () => {
        state.detailsOpen.set(key, details.open);
      });
      const body = document.createElement("div");
      if (bodyClassName) body.className = bodyClassName;
      details.appendChild(body);
      if (parent) parent.appendChild(details);
      if (fill) withPath(segment, () => fill(body, details));
      return { details, body };
    }

    function restoreEditorFocus(fkey) {
      let holder = null;
      el.editorScroll.querySelectorAll("[data-fkey]").forEach(node => {
        if (!holder && node.dataset.fkey === fkey) holder = node;
      });
      if (!holder) return;
      const focusable = holder.matches("input, textarea, select")
        ? holder
        : holder.querySelector("input, textarea, select");
      if (focusable) focusable.focus({ preventScroll: true });
    }

    function renderEditor() {
      const current = getCurrent();
      if (!current) {
        el.editorTitle.textContent = "条目详情";
        el.editorSubtitle.textContent = "请先导入当前数据文件";
        el.editorScroll.innerHTML = "<div class=\"empty-state\">请先导入 public/assets/data 中的数据文件。</div>";
        return;
      }
      if (!state.selected || !resolveRow(state.selected)) {
        el.editorTitle.textContent = DATASETS[state.currentFile].label + "详情";
        el.editorSubtitle.textContent = "选择左侧表格中的条目进行编辑";
        el.editorScroll.innerHTML = "<div class=\"empty-state\">选择一个条目后，这里会显示友好表单。</div>";
        return;
      }

      const row = resolveRow(state.selected);
      const item = getItem(row);
      // 重建前先记下焦点所在字段和滚动位置，重建后原样还原。
      const active = document.activeElement;
      const focusKey =
        active && el.editorScroll.contains(active) && active.closest
          ? active.closest("[data-fkey]") && active.closest("[data-fkey]").dataset.fkey
          : null;
      const scrollTop = el.editorScroll.scrollTop;
      pathStack = [state.currentFile + "|" + (row.id || row.category + "#" + row.index)];
      el.editorTitle.textContent = getName(row) || "未命名条目";
      el.editorSubtitle.textContent = DATASETS[state.currentFile].label + " / " + row.category;
      const wrap = document.createElement("div");

      if (state.currentFile === "baseInfo.json") renderBaseInfoEditor(wrap, row, item);
      else if (state.currentFile === "coreClassification.json") renderCoreEditor(wrap, row, item);
      else if (state.currentFile === "partners.json") renderPartnerEditor(wrap, row, item);
      else if (state.currentFile === "assets.json") renderAssetEditor(wrap, row, item);
      else renderStandardEditor(wrap, row, item);

      el.editorScroll.innerHTML = "";
      el.editorScroll.appendChild(wrap);
      el.editorScroll.scrollTop = scrollTop;
      // 焦点若随重建丢失（例如点到了空白处、或正要点的控件被替换掉），就还给原来的字段。
      if (focusKey && !el.editorScroll.contains(document.activeElement)) restoreEditorFocus(focusKey);
    }

    function renderStandardEditor(wrap, row, item) {
      addTextField(wrap, "名称", item, "name", "必填，用于表格和搜索");
      addNumberField(wrap, "消耗", item, "cost", "数字");
      if (state.currentFile === "skills.json") addTextField(wrap, "消耗说明", item, "consume", "例如 攻击: 20MP");
      if (state.currentFile !== "backgrounds.json") {
        addDatalistField(wrap, "类型", item, "type", collectFieldValues("type"));
        addSelectField(wrap, "品质", item, "rarity", rarityOptions());
        addTagsField(wrap, "标签", item, "tag");
        addKeyValueField(wrap, "效果", item, "effect");
      }
      if (state.currentFile === "items.json") addNumberField(wrap, "数量", item, "quantity", "默认 1");
      if (state.currentFile === "backgrounds.json") {
        addTextField(wrap, "需要种族", item, "requiredRace", "可留空");
        addTextField(wrap, "需要地点", item, "requiredLocation", "可留空");
        addTextField(wrap, "需要身份", item, "requiredIdentity", "可留空");
      }
      addTextareaField(wrap, "描述", item, "description", "叙事描述或说明");
    }

    function renderAssetEditor(wrap, row, item) {
      addTextField(wrap, "名称", item, "name", "必填，用于表格和搜索");

    function addTagsField(parent, label, obj, key) {
      if (!Array.isArray(obj[key])) obj[key] = [];
      const shell = fieldShell(parent, label, "回车添加、点小叉删除，按住标签拖动可调整顺序");
      const editor = document.createElement("div");
      editor.className = "tag-editor";
      const tags = obj[key];
      let sourceIndex = -1;

      const clearTagMarkers = () => {
        editor.querySelectorAll(".tag-item.drop-before, .tag-item.drop-after").forEach(node => {
          node.classList.remove("drop-before", "drop-after");
        });
      };
      const finishTagDrag = () => {
        clearTagMarkers();
        editor.querySelectorAll(".tag-item.dragging").forEach(node => node.classList.remove("dragging"));
        sourceIndex = -1;
      };

      tags.forEach((tag, index) => {
        const chip = document.createElement("span");
        chip.className = "tag-item";
        chip.draggable = true;
        chip.title = "按住左键拖动，会直接改变这个标签在 JSON 数组里的位置";

        const grip = document.createElement("span");
        grip.className = "tag-grip";
        grip.textContent = "⋮⋮";

        const text = document.createElement("span");
        text.textContent = tag;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "删除标签";
        remove.addEventListener("click", () => {
          commitDirect("删除标签 " + tag, () => {
            if (!Array.isArray(obj[key])) obj[key] = [];
            obj[key].splice(index, 1);
          });
        });

        chip.addEventListener("dragstart", event => {
          sourceIndex = index;
          event.dataTransfer.effectAllowed = "move";
          try {
            event.dataTransfer.setData("text/plain", String(index));
          } catch (_error) {
            // 某些浏览器禁止在 dragstart 写入数据，忽略即可。
          }
          chip.classList.add("dragging");
        });
        chip.addEventListener("dragend", finishTagDrag);

        chip.append(grip, text, remove);
        editor.appendChild(chip);
      });

      // 容器级精确落点：指针在标签上、标签间隙、换行空隙或末尾空白时，
      // 都取“离指针最近的其它标签”并按其左右半区决定插入到前面还是后面。
      const dropTargetFor = (clientX, clientY) => {
        let best = null;
        let bestD = Infinity;
        editor.querySelectorAll(".tag-item").forEach((node, chipIndex) => {
          if (chipIndex === sourceIndex) return;
          const rect = node.getBoundingClientRect();
          const dx = Math.max(rect.left - clientX, 0, clientX - rect.right);
          const dy = Math.max(rect.top - clientY, 0, clientY - rect.bottom);
          const distance = dx * dx + dy * dy;
          if (distance < bestD) {
            bestD = distance;
            best = { node, index: chipIndex, center: rect.left + rect.width / 2 };
          }
        });
        if (!best) return null;
        return { node: best.node, index: best.index, side: clientX < best.center ? "before" : "after" };
      };

      editor.addEventListener("dragover", event => {
        if (sourceIndex === -1) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        const target = dropTargetFor(event.clientX, event.clientY);
        clearTagMarkers();
        if (!target) return;
        target.node.classList.add(target.side === "before" ? "drop-before" : "drop-after");
      });
      editor.addEventListener("dragleave", event => {
        if (event.relatedTarget && editor.contains(event.relatedTarget)) return;
        clearTagMarkers();
      });
      editor.addEventListener("drop", event => {
        if (sourceIndex === -1) return;
        event.preventDefault();
        const target = dropTargetFor(event.clientX, event.clientY);
        if (!target) {
          finishTagDrag();
          return;
        }
        // 先考虑源行移除带来的位移，再按左右半区确定插入位置。
        let to = target.index;
        if (sourceIndex < target.index) to -= 1;
        if (target.side === "after") to += 1;
        to = Math.max(0, Math.min(to, tags.length - 1));
        if (to !== sourceIndex) {
          const movedText = tags[sourceIndex];
          commitDirect("调整标签顺序 " + movedText, () => {
            const [moved] = tags.splice(sourceIndex, 1);
            tags.splice(to, 0, moved);
          });
        }
        finishTagDrag();
      });

      const input = document.createElement("input");
      input.placeholder = "输入后回车";
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          const value = input.value.trim();
          if (!value) return;
          commitDirect("添加标签 " + value, () => {
            if (!Array.isArray(obj[key])) obj[key] = [];
            if (!obj[key].includes(value)) obj[key].push(value);
          });
        }
      });
      editor.appendChild(input);
      shell.appendChild(editor);
    }

    function addNestedRecord(parent, owner, key, label) {

          makeDetails(body, "g:" + groupName, escapeHtml(groupName), false, "detail-body kv-list", groupBody => {

              groupBody.appendChild(kvRow(effectName, effectText, (nextKey, nextValue) => {
                updateSelected("修改 " + label, target => {
                  const stairway = target.stairway || {};
                  const root = stairway[key] || {};
                  const inner = root[groupName] || {};
                  if (nextKey !== effectName) delete inner[effectName];
                  if (nextKey) inner[nextKey] = nextValue;
                  root[groupName] = inner;
                  stairway[key] = root;
                  target.stairway = stairway;
                });
              }, () => {
                updateSelected("删除 " + effectName, target => {
                  target.stairway?.[key]?.[groupName] && delete target.stairway[key][groupName][effectName];

              }));
